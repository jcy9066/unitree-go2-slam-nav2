<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Go2 Map Manager</title>
<style>
:root{font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;color-scheme:light dark;--bg:#f1f2ee;--card:#fff;--ink:#181c1a;--dim:#52616a;--rule:#d9ddd3;--accent:#0b6ca8}
@media(prefers-color-scheme:dark){:root{--bg:#101310;--card:#1c2220;--ink:#ebefeb;--dim:#adb9b3;--rule:#38433b;--accent:#8bc9ef}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;line-height:1.55}
main{max-width:1000px;margin:auto;padding:44px 22px 100px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-bottom:1px solid var(--rule);padding-bottom:28px}
h1{font-family:Georgia,"Noto Serif KR",serif;font-size:clamp(26px,4vw,38px);margin:0}
header p{margin:8px 0 0;color:var(--dim)}
h2{font-size:17px;margin:30px 0 16px}
button{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:7px;padding:9px 13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:white;border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;overflow:hidden;min-width:0}
.preview{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--dim);overflow:hidden}
.preview img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.details{padding:16px}
.name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.date{font-size:12px;color:var(--dim);margin-top:4px}
.actions{margin-top:14px}
form{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}
input{flex:1;min-width:120px;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:6px;font:inherit;padding:9px}
#status{color:var(--dim);min-height:24px}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:44px;text-align:center;color:var(--dim)}
.note{color:var(--dim);font-size:13px;margin-top:24px}
@media(max-width:580px){header{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Go2 Map Manager</h1><p>저장된 지도 확인 및 표시 이름 변경</p></div>
  <button id="refresh" type="button">새로고침</button>
</header>
<section aria-labelledby="map-title">
  <h2 id="map-title">저장된 지도</h2>
  <p id="status" role="status" aria-live="polite">지도 목록을 불러오는 중입니다.</p>
  <div class="grid" id="maps"></div>
</section>
<p class="note">지도 이름은 메타데이터에서만 변경합니다. RTAB-Map 원본 DB와 저장 경로는 수정하지 않습니다. 이 페이지는 실습 튜토리얼과 독립적으로 실행됩니다.</p>
</main>
<script>
'use strict';
const grid=document.getElementById('maps'),status=document.getElementById('status');
function el(tag,className,text){
  const element=document.createElement(tag);
  if(className)element.className=className;
  if(text!==undefined)element.textContent=text;
  return element;
}
function displayDate(value){
  const date=new Date(value);
  return Number.isNaN(date.valueOf())?value:date.toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'});
}
function card(map){
  const outer=el('article','card');
  const preview=el('div','preview');
  if(map.preview){
    const img=document.createElement('img');
    img.src='/api/maps/'+encodeURIComponent(map.id)+'/preview';
    img.alt=map.name+' 지도 미리보기';
    img.onerror=()=>{preview.replaceChildren(el('span',null,'미리보기 없음'));};
    preview.append(img);
  }else{preview.append(el('span',null,'미리보기 없음'));}
  outer.append(preview);
  const details=el('div','details');
  const title=el('div','name',map.name);
  const date=el('div','date',displayDate(map.date));
  const actions=el('div','actions');
  const renameButton=el('button',null,'이름 변경');
  renameButton.type='button';
  renameButton.addEventListener('click',()=>{
    if(actions.querySelector('form'))return;
    const form=document.createElement('form');
    const input=document.createElement('input');
    input.type='text';input.maxLength=80;input.required=true;input.value=map.name;
    input.setAttribute('aria-label','지도 이름');
    const save=el('button','primary','저장');save.type='submit';
    const cancel=el('button',null,'취소');cancel.type='button';
    cancel.onclick=()=>form.remove();
    form.append(input,save,cancel);
    form.onsubmit=async(event)=>{
      event.preventDefault();
      save.disabled=true;
      try{
        const response=await fetch('/api/maps/'+encodeURIComponent(map.id)+'/rename',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:input.value.trim()})
        });
        const result=await response.json();
        if(!response.ok)throw new Error(result.error||'변경 실패');
        title.textContent=result.map.name;
        map.name=result.map.name;
        if(preview.querySelector('img'))preview.querySelector('img').alt=map.name+' 지도 미리보기';
        form.remove();status.textContent='지도 이름을 변경했습니다.';
      }catch(error){status.textContent='이름 변경 실패: '+error.message;}
      finally{save.disabled=false;}
    };
    actions.append(form);input.focus();input.select();
  });
  actions.append(renameButton);
  details.append(title,date,actions);outer.append(details);
  return outer;
}
async function refresh(){
  status.textContent='지도 목록을 불러오는 중입니다.';
  try{
    const response=await fetch('/api/maps',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const result=await response.json();
    grid.replaceChildren();
    for(const map of result.maps){grid.append(card(map));}
    if(!result.maps.length){grid.append(el('div','empty','저장된 지도가 없습니다.'));}
    status.textContent='총 '+result.maps.length+'개의 지도';
  }catch(error){status.textContent='지도 목록을 불러올 수 없습니다: '+error.message;}
}
document.getElementById('refresh').addEventListener('click',refresh);
refresh();
</script>
</body>
</html>
